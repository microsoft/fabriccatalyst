  - title: One NZ Democratizes Data Access with Real-Time Analytics
    subtitle: Transforming customer support with instant data insights
    description: |-
      One NZ, New Zealand's largest mobile carrier, revolutionized their customer service using Microsoft Fabric RTI. Their implementation achieved:
      
      * Reduction in call answer time from 45 to 27 seconds
      * Real-time dashboard updates every 10 seconds
      * Support for 170 business users and 800 contact center agents
      * Democratized data access across the organization
    features:
